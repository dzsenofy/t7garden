# Camera streams for the browser. Fill in from the NVR probe output:
#   cd backend && python -m app.adapters.hikvision_nvr --host <nvr> --user <u> --password <p>
# Channel N sub-stream = N02 (lighter, fine for phones); main stream = N01.
streams:
  cam1: rtsp://USER:PASSWORD@NVR_IP:554/Streaming/Channels/102
  cam2: rtsp://USER:PASSWORD@NVR_IP:554/Streaming/Channels/202
  cam3: rtsp://USER:PASSWORD@NVR_IP:554/Streaming/Channels/302
  cam4: rtsp://USER:PASSWORD@NVR_IP:554/Streaming/Channels/402

api:
  listen: ":1984"

webrtc:
  listen: ":8555"
  candidates:
    - stun:8555   # WebRTC over Tailscale works without a public STUN; MSE is the fallback
