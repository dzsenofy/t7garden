# Run on the Raspberry Pi / mini PC on the house LAN:
#   cp ../.env.example ../.env  && edit
#   docker compose up -d --build
# Then open https://<machine-name>.<tailnet>.ts.net from any device on your Tailscale network.

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: siofok            # becomes the MagicDNS name: siofok.<tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # Tailscale HTTPS cert + reverse proxy to caddy
      - TS_USERSPACE=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [net_admin, sys_module]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets caddy (sharing this netns) reach host-network services
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    network_mode: service:tailscale   # shares the tailscale network namespace -> reachable as the ts.net name
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
    depends_on: [backend, go2rtc]
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: ../.env
    environment:
      - DB_PATH=/data/scc.db
    volumes:
      - ./data/backend:/data
      - ./data/panasonic:/root        # aio-panasonic-comfort-cloud token cache (~/.panasonic-settings)
    network_mode: host                # needed for Broadlink UDP discovery + LAN devices
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    network_mode: host                # RTSP in, WebRTC/MSE out on :1984
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped
